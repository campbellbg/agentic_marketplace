AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  SPA hosting: a private S3 bucket served through CloudFront (agentic-builder
  pattern app-serving). Deployed as <env> (production) and
  <env>-nonprod (shared by PR previews under /pr-<number>/).

Parameters:
  ResourceName:
    Type: String
    Description: The production environment name for production, or <name>-nonprod for non-production.
    AllowedPattern: '^[a-z][a-z0-9-]{1,46}[a-z0-9]$'
    ConstraintDescription: Lowercase letters, digits and hyphens; 3-48 characters; starts with a letter.
  EnvironmentType:
    Type: String
    AllowedValues: [prod, nonprod]
  ContentSecurityPolicy:
    Type: String
    Description: Content-Security-Policy header. Widen only as far as the app needs.
    Default: "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

Conditions:
  IsProd: !Equals [!Ref EnvironmentType, prod]

Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub '${ResourceName}-${AWS::AccountId}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowThisDistributionToRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}'
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt SiteBucket.Arn
              - !Sub '${SiteBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${ResourceName}-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  RoutingFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${ResourceName}-spa-routing'
      AutoPublish: true
      FunctionConfig:
        Comment: SPA routing - serve index.html for client-side routes
        Runtime: cloudfront-js-2.0
      FunctionCode: !If
        - IsProd
        - |
          function handler(event) {
            var request = event.request;
            var uri = request.uri;
            // A path with no file extension is a client-side route.
            if (uri.endsWith('/') || uri.lastIndexOf('.') < uri.lastIndexOf('/')) {
              request.uri = '/index.html';
            }
            return request;
          }
        - |
          function handler(event) {
            var request = event.request;
            var match = request.uri.match(/^\/pr-([0-9]+)(\/.*)?$/);
            // Only PR slots are served from the shared non-production distribution.
            if (!match) {
              return { statusCode: 404, statusDescription: 'Not Found' };
            }
            var slot = '/pr-' + match[1];
            if (!match[2]) {
              return {
                statusCode: 301,
                statusDescription: 'Moved Permanently',
                headers: { location: { value: slot + '/' } }
              };
            }
            var path = match[2];
            // A path with no file extension is a client-side route.
            if (path.endsWith('/') || path.lastIndexOf('.') < path.lastIndexOf('/')) {
              request.uri = slot + '/index.html';
            }
            return request;
          }

  SecurityHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub '${ResourceName}-security-headers'
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            ContentSecurityPolicy: !Ref ContentSecurityPolicy
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: false
            Override: true
        CustomHeadersConfig: !If
          - IsProd
          - !Ref AWS::NoValue
          - Items:
              - Header: X-Robots-Tag
                Value: 'noindex, nofollow'
                Override: true

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Ref ResourceName
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        Origins:
          - Id: site-bucket
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: site-bucket
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
          ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt RoutingFunction.FunctionMetadata.FunctionARN
        ViewerCertificate:
          CloudFrontDefaultCertificate: true

Outputs:
  BucketName:
    Value: !Ref SiteBucket
  DistributionId:
    Value: !Ref Distribution
  DistributionDomainName:
    Value: !GetAtt Distribution.DomainName
